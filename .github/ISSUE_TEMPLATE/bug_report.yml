name: Bug report
description: Report a reproducible Screensaver Playlist problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not publish root-access or command-injection vulnerabilities here; use a private security advisory.
  - type: input
    id: tv
    attributes:
      label: TV model
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware and reported webOS version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Compatibility check, manager output, and logs
      render: shell
  - type: textarea
    id: recovery
    attributes:
      label: Recovery result
      description: State whether Disable override or the emergency recovery commands restored the stock screensaver.

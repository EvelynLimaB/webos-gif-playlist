name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Install shell tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify release and application versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./appinfo.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="${GITHUB_REF_NAME#release/}"
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* ]] || [[ "$APP_VERSION" != "$TAG_VERSION" ]]; then
            echo "Release ref $GITHUB_REF_NAME does not match appinfo.json version $APP_VERSION" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Run validation suite
        run: make check

      - name: Install LG webOS CLI
        run: npm install --global @webos-tools/cli@3.2.5

      - name: Build and audit IPK
        run: |
          make package
          make audit-package

      - name: Generate Homebrew Channel manifest
        id: manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          APP_ID="com.evelyn.webosgifplaylist"
          IPK="${APP_ID}_${VERSION}_all.ipk"
          MANIFEST="${APP_ID}.manifest.json"
          SHA256="$(sha256sum "$IPK" | awk '{print $1}')"
          IPK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${IPK}"

          node - "$VERSION" "$IPK_URL" "$SHA256" "$MANIFEST" <<'NODE'
          const fs = require('fs');
          const [version, ipkUrl, sha256, manifestPath] = process.argv.slice(2);
          const manifest = {
            id: 'com.evelyn.webosgifplaylist',
            version,
            type: 'web',
            title: 'Screensaver Playlist',
            appDescription: 'A rotating playlist of animated and still images for rooted LG webOS TVs.',
            iconUri: 'https://raw.githubusercontent.com/EvelynLimaB/webos-gif-playlist/main/assets/idlegif300.png',
            sourceUrl: 'https://github.com/EvelynLimaB/webos-gif-playlist',
            rootRequired: true,
            ipkUrl,
            ipkHash: { sha256 }
          };
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE

          node -e "JSON.parse(require('fs').readFileSync('$MANIFEST', 'utf8'))"
          echo "ipk=$IPK" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IPK: ${{ steps.manifest.outputs.ipk }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$RELEASE_TAG"
            "$IPK"
            "$MANIFEST"
            --title "Screensaver Playlist $RELEASE_TAG"
            --generate-notes
          )
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "${args[@]}"

      - name: Write release summary
        env:
          SHA256: ${{ steps.manifest.outputs.sha256 }}
          IPK: ${{ steps.manifest.outputs.ipk }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Release assets"
            echo
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- IPK: \`$IPK\`"
            echo "- Manifest: \`$MANIFEST\`"
            echo "- SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate sources
        run: |
          sh -n assets/manager.sh
          sh -n assets/install.sh
          sh -n assets/uninstall.sh
          sh -n test/manager-test.sh
          sh test/manager-test.sh
          node --check js/webos.js
          node --check js/view.js
          node --check js/app.js
          ! grep -RE '=>|\.finally[[:space:]]*\(|\basync\b|\bawait\b|\bclass[[:space:]]' js/webos.js js/view.js js/app.js
          ! grep -RE '(^|[;{[:space:]])gap[[:space:]]*:|display:[[:space:]]*grid|var\(--' css/app.css

      - name: Install ares-cli
        run: npm install -g @webosose/ares-cli

      - name: Build IPK
        run: make package

      - name: Get package metadata
        id: metadata
        run: |
          echo "version=$(node -p "require('./appinfo.json').version")" >> "$GITHUB_OUTPUT"
          echo "app_id=$(node -p "require('./appinfo.json').id")" >> "$GITHUB_OUTPUT"

      - name: Generate Homebrew manifest
        run: |
          APP_ID="${{ steps.metadata.outputs.app_id }}"
          VERSION="${{ steps.metadata.outputs.version }}"
          IPK="${APP_ID}_${VERSION}_all.ipk"
          SHA256=$(sha256sum "$IPK" | cut -d' ' -f1)
          cat > "${APP_ID}.manifest.json" <<MANIFEST
          {
            "id": "${APP_ID}",
            "version": "${VERSION}",
            "type": "web",
            "title": "GIF Playlist",
            "appDescription": "Rotating local GIF screensaver playlist for rooted LG webOS TVs",
            "iconUri": "https://raw.githubusercontent.com/EvelynLimaB/webos-gif-playlist/main/assets/idlegif130.png",
            "sourceUrl": "https://github.com/EvelynLimaB/webos-gif-playlist",
            "ipkUrl": "https://github.com/EvelynLimaB/webos-gif-playlist/releases/download/${{ github.ref_name }}/${IPK}",
            "rootRequired": true,
            "ipkHash": { "sha256": "${SHA256}" }
          }
          MANIFEST

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            com.evelyn.webosgifplaylist_${{ steps.metadata.outputs.version }}_all.ipk
            com.evelyn.webosgifplaylist.manifest.json
          generate_release_notes: true

name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install shell tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null

      - name: Run shell checks
        id: shellcheck
        continue-on-error: true
        run: |
          set -o pipefail
          make shellcheck 2>&1 | tee shellcheck.log

      - name: Upload ShellCheck diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shellcheck-diagnostics
          path: shellcheck.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce ShellCheck result
        if: steps.shellcheck.outcome == 'failure'
        run: exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run integration and source checks
        run: make test check-js

      - name: Install LG webOS CLI
        run: npm install --global @webos-tools/cli@3.2.5

      - name: Build IPK
        run: make package

      - name: Audit packaged contents
        run: make audit-package

      - name: Record package checksum
        run: sha256sum com.evelyn.webosgifplaylist_*_all.ipk

      - name: Upload test package
        uses: actions/upload-artifact@v7
        with:
          name: webos-gif-playlist-ipk
          path: com.evelyn.webosgifplaylist_*_all.ipk
          if-no-files-found: error
          retention-days: 90

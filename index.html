<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GIF Playlist</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div>
        <h1>GIF Playlist</h1>
        <p class="sub">Built for rooted LG webOS 4.x TVs</p>
      </div>
      <div id="enabled-indicator" class="indicator disabled">
        <span id="value-enabled">Disabled</span>
      </div>
    </header>

    <section class="summary">
      <div class="summary-item">
        <span class="label">Target</span>
        <span id="value-target" class="value">Detecting…</span>
      </div>
      <div class="summary-item">
        <span class="label">Playlist</span>
        <span id="value-count" class="value">0 / 12</span>
      </div>
    </section>

    <section class="panel add-panel">
      <h2>Add a direct GIF URL</h2>
      <div class="input-row">
        <input type="text" id="url-input" placeholder="https://example.com/animation.gif" spellcheck="false" autocomplete="off">
        <button id="btn-add" class="primary">Download and add</button>
      </div>
      <p class="hint">The TV validates the GIF and stores it locally. Maximum: 25 MiB each, 12 items.</p>
    </section>

    <section class="panel settings-panel">
      <h2>Playback</h2>
      <div class="button-row">
        <button id="btn-mode">Order: Sequential</button>
        <button id="btn-fit">Scaling: Crop</button>
        <button id="btn-duration">Switch every: 30s</button>
      </div>
    </section>

    <section class="panel playlist-panel">
      <div class="section-header">
        <h2>Downloaded GIFs</h2>
        <button id="btn-refresh">Refresh</button>
      </div>
      <div id="playlist"></div>
    </section>

    <section class="actions">
      <button id="btn-enable" class="success">Enable at boot</button>
      <button id="btn-test">Test screensaver</button>
      <button id="btn-disable">Disable override</button>
      <button id="btn-reset" class="danger">Reset all data</button>
    </section>

    <div id="status">Starting…</div>
  </div>

  <script src="js/webos.js"></script>
  <script src="js/view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
